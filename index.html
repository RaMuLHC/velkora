<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>危殼 Velkora Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="危殼 Velkora - 原創黑闇高魔 TRPG 世界觀維基官方指南">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 🌟 修正點 1：必須保留 Docsify 的基礎結構骨架，外掛才能在這個基礎上切換顏色 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- 🌙 引入日夜切換主題的 CSS 換色外掛 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
  
  <style>
    /* 自訂微調：優化 Docsify 在暗黑模式下的滾動條與細節質感 */
    .markdown-section pre {
      background-color: #161b26 !important;
    }
    .sidebar .app-name {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.05rem;
    }
  </style>
</head>
<body>
  <div id="app">正在翻開崩壞現實指南...</div>
  
  <script>
    window.$docsify = {
      name: 'Velkora Wiki',
      repo: 'ramulhc/velkora',    
      
      // 🌟 修正點 2：關閉 loadSidebar 模式。
      // 這樣 Docsify 才會改用下面的 maxLevel 全自動抓取你單一檔案內的 ## 標題當作目錄！
      loadSidebar: false,          
      
      maxLevel: 5,                // 側邊欄抓取內文標題的最大深度（H1 ~ H3）
      subMaxLevel: 5,             
      autoHeader: true,           
      
      darklightTheme: {
        defaultTheme: 'dark',     // 預設直接開大燈切換到暗黑模式
        dark: {
          accent: '#ef4444',            // 危殼血紅
          sidebarBackground: '#0c0f17', 
          background: '#111420',        
          borderColor: '#222c3f',
          textColor: '#cbd5e1'          
        },
        light: {
          accent: '#dc2626',            
          sidebarBackground: '#ffffff', 
          background: '#f8fafc',        
          borderColor: '#e2e8f0',
          textColor: '#0f172a'          
        }
      }
    };
  </script>

  <!-- Docsify 核心發動機與外掛指令 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  
</body>
</html>

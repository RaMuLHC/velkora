<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
</head>
<body>
  <div id="app">系統世界觀載入中...</div>
<script>
    window.$docsify = {
      name: '危殼 Crisis Shell Wiki',
      maxLevel: 5,
      
      // 🔽 貼上這段日夜切換設定
      darklightTheme: {
        defaultTheme: 'dark', // 🌟 關鍵：讓網站預設就是暗黑模式
        dark: {
          accent: '#ef4444',   // 暗黑模式下的強調色（這裡設定為帥氣的危殼血紅色）
          sidebarBackground: '#0c0f17', // 側邊欄背景色
          background: '#111420'         // 主內文背景色
        },
        light: {
          accent: '#ef4444',   // 亮光模式下的強調色
          sidebarBackground: '#ffffff',
          background: '#f8fafc'
        }
      }
    }
  </script>
  <!-- 放在原本的 docsify.min.js 下方即可 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
</body>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>危殼 Crisis Shell Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="危殼 Crisis Shell - 原創黑闇高魔 TRPG 世界觀維基官方指南">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 🌟 引入日夜切換主題的 CSS 核心樣式（已全面取代舊版白底 vue.css） -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
  
  <style>
    /* 自訂微調：優化 Docsify 在暗黑模式下的滾動條與細節質感 */
    body {
      font-variant-numeric: tabular-nums;
    }
    .markdown-section pre {
      background-color: #161b26 !important;
    }
    /* 讓左上角的專案名稱字體更粗、更具備設定集質感 */
    .sidebar .app-name {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.05rem;
    }
  </style>
</head>
<body>
  <!-- 網頁載入時的過渡文字 -->
  <div id="app">正在翻開崩壞現實指南...</div>
  
  <script>
    window.$docsify = {
      // 💡 基礎站點設定
      name: '危殼 Crisis Shell',
      repo: 'ramulhc/velkora',    // 右上角會自動出現 GitHub 小貓咪傳送門
      
      // 📂 側邊欄導覽自動化配置
      loadSidebar: true,          // 🌟 核心：開啟自動抓取側邊欄目錄功能
      autoHeader: true,           // 如果頁面沒寫大標題，自動抓取檔名當作標題
      subMaxLevel: 4,             // 右側動態目錄深度：自動抓取內文的 H2 與 H3 標題
      maxLevel: 5,                // 最大抓取層級
      
      // 🎨 暗黑 / 亮光主題客製化大腦
      darklightTheme: {
        defaultTheme: 'dark',     // 🌟 關鍵：讀者一進來網站，預設就是高質感的暗黑模式
        dark: {
          accent: '#ef4444',            // 危殼血紅強調色（超連結、重點提示）
          sidebarBackground: '#0c0f17', // 暗黑模式下的側邊欄背景色
          background: '#111420',        // 暗黑模式下的主要內文背景色
          borderColor: '#222c3f',
          textColor: '#cbd5e1'          // 柔和不傷眼的白字
        },
        light: {
          accent: '#dc2626',            // 亮光模式下的深紅色超連結
          sidebarBackground: '#ffffff', // 亮光模式側邊欄
          background: '#f8fafc',        // 亮光模式主內文（偏冷調的舒適白）
          borderColor: '#e2e8f0',
          textColor: '#0f172a'          // 亮光模式深色字
        }
      }
    };
  </script>

  <!-- 🛠️ Docsify 核心發動機腳本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 🌙 日夜切換開關的自動化 UI 觸發腳本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  
</body>
</html>
